<style>
/* Layout: one centred stage where screens swap in place. A spinning vinyl sits behind the MMQ logo on the menu; questions use a Kahoot-style four-colour answer grid. Single dark look by design (a stage-lit quiz show). */
:root{
  --bg:#120a24; --surface:#1e1340; --surface2:#2d1d5e;
  --fg:#f6f0ff; --muted:#b0a3d6; --ink:#1a0c2e;
  --pink:#ff3d8b; --cyan:#2fd6ff; --yellow:#ffd23f; --lime:#8cf04a; --flame:#ff7a1a;
  --yellow-deep:#b88f00;
  --font-display:'Bowlby One',Impact,'Arial Black',sans-serif;
  --font-body:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.5 var(--font-body);
  background-image:radial-gradient(ellipse at 15% 0%,rgba(255,61,139,.18),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(47,214,255,.14),transparent 55%);
  background-attachment:fixed;
  min-height:100vh;
  padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.stage{max-width:1040px;margin:0 auto}
h1,h2,h3,p{margin:0}
h2{font-family:var(--font-display);font-weight:400;font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.screen{display:flex;flex-direction:column;gap:20px;min-width:0}
.screen:not(.menu){max-width:760px;width:100%;margin-inline:auto}

/* Menu: follows the hand sketch. Mode cards flank a die-cut sticker logo, with an outlined PLAY below. */
.menu{gap:34px;align-items:center}
.crumb{align-self:flex-start;margin:0;font-family:var(--font-display);font-size:1.05rem;line-height:1.3;border:2px solid var(--muted);border-radius:14px;padding:6px 18px}
.crumb b{color:var(--yellow);font-weight:400;font-size:1.35em}
.menu-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.9fr) minmax(0,1fr);gap:clamp(12px,3vw,32px);align-items:center;width:100%}
.logo-cell{margin:0;min-width:0}
.logo-art{display:block;width:100%;max-width:600px;height:auto;margin:0 auto;overflow:visible;filter:drop-shadow(0 10px 22px rgba(0,0,0,.5));animation:drop .7s cubic-bezier(.3,1.4,.5,1) both}
.mode{aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-width:0;padding:16px 10px;background:transparent;color:var(--muted);border:3px solid var(--muted);border-radius:28px;font-weight:600;font-size:clamp(.8rem,1.9vw,1.05rem);letter-spacing:.2em;text-transform:uppercase;line-height:1.35;text-align:center;transition:border-color .15s,color .15s,background .15s,box-shadow .15s}
.mode svg{height:auto;fill:currentColor}
.mode[data-mode="single"] svg{width:50%}
.mode[data-mode="multi"] svg{width:84%}
.mode small{font-weight:400;font-size:.8rem;letter-spacing:0;text-transform:none;opacity:.85}
.mode:hover{border-color:var(--fg);color:var(--fg)}
.mode[aria-checked="true"]{border-color:var(--yellow);color:var(--yellow);background:rgba(255,210,63,.09);box-shadow:0 0 0 4px rgba(255,210,63,.22)}
.play.play-outline{font-size:clamp(2.2rem,8vw,3.4rem);letter-spacing:.07em;line-height:1;padding:10px 56px 14px;background:transparent;color:transparent;-webkit-text-stroke:2px var(--fg);border:3px solid var(--fg);border-radius:22px;box-shadow:0 0 0 6px var(--bg),0 0 0 8px var(--muted)}
.play.play-outline:hover,.play.play-outline:focus-visible{background:var(--yellow);color:var(--ink);-webkit-text-stroke:0;border-color:var(--yellow)}
.play.play-outline:active{transform:translateY(3px)}
.link{background:none;border:0;color:var(--cyan);font-weight:600;text-decoration:underline;text-underline-offset:4px;padding:6px}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.93)}to{opacity:1;transform:none}}
@media (max-width:720px){
  .menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .logo-cell{grid-column:1/-1;order:-1}
  .mode{aspect-ratio:auto;min-height:190px;align-self:stretch}
}

/* HUD + timer */
.hud{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:800;flex-wrap:wrap}
.hud span{min-width:0}
.hud .muted{color:var(--muted);font-weight:600}
.pill{background:var(--surface2);border-radius:99px;padding:4px 14px;font-variant-numeric:tabular-nums}
.timer{display:flex;gap:12px;align-items:center}
.bar{flex:1;height:14px;border-radius:99px;background:var(--surface);overflow:hidden;min-width:0}
.bar i{display:block;height:100%;width:100%;background:var(--lime);border-radius:99px}
.bar i.low{background:var(--pink)}
.timer b{font-family:var(--font-display);font-weight:400;font-size:1.6rem;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.q{background:var(--surface);border-radius:14px;padding:22px 20px;font-family:var(--font-display);font-weight:400;font-size:clamp(1.25rem,4.4vw,1.9rem);line-height:1.2;text-wrap:balance;text-align:center}

/* Answers */
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ans{display:flex;gap:12px;align-items:center;text-align:left;border:0;border-radius:12px;padding:18px 16px;min-height:88px;font-weight:800;font-size:1.1rem;line-height:1.25;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.4);overflow-wrap:anywhere;transition:transform .08s,opacity .2s}
.ans:hover{transform:translateY(-2px)}
.ans:active{transform:translateY(4px)}
.ans .shape{font-size:1.6rem;line-height:1;flex:none;width:1.6rem;text-align:center}
.a0{background:var(--pink)} .a1{background:var(--cyan)} .a2{background:var(--yellow)} .a3{background:var(--lime)}
.ans.dim{opacity:.3}
.ans.picked{outline:4px solid var(--fg);outline-offset:3px}
.hint{color:var(--muted);text-align:center;font-size:.88rem}

/* Ready / lobby / how-to */
.ready{align-items:center;text-align:center;padding-block:40px}
.ready .big{font-family:var(--font-display);font-size:clamp(2.2rem,9vw,4rem);line-height:1.05;color:var(--yellow);overflow-wrap:anywhere}
.ready .small{color:var(--muted);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field .row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;background:var(--surface);color:var(--fg);border:3px solid var(--surface2);border-radius:10px;padding:12px 14px;font:inherit;font-size:1.1rem}
input[type=text]::placeholder{color:#7d70a8}
.mini{border:0;background:var(--surface2);border-radius:10px;padding:0 14px;font-weight:800}
.lobby{max-width:520px;margin:0 auto;width:100%}
.howto{max-width:620px;margin:0 auto;width:100%}
.howto ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.howto li{background:var(--surface);border-radius:12px;padding:14px 16px;display:flex;gap:12px}
.howto li b{color:var(--yellow)}
.keys kbd{display:inline-block;min-width:1.7em;text-align:center;background:var(--surface2);border-radius:6px;padding:1px 6px;font:800 .9rem var(--font-body);border-bottom:3px solid var(--ink)}

/* Results */
.verdict{text-align:center;font-family:var(--font-display);font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.1}
.verdict.good{color:var(--lime)} .verdict.bad{color:var(--pink)}
.correct{display:flex;gap:14px;align-items:center;border-radius:12px;padding:14px 16px;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.4)}
.correct small{display:block;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.72rem;opacity:.75}
.correct strong{font-size:1.25rem;line-height:1.2;overflow-wrap:anywhere}
.correct .shape{font-size:1.8rem;line-height:1}
.note{color:var(--muted);text-align:center}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row-s{display:grid;grid-template-columns:2rem minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:800;animation:slide .35s both;animation-delay:var(--d,0ms)}
.row-s .rank{font-family:var(--font-display);font-weight:400;color:var(--yellow);font-size:1.2rem}
.row-s .name{display:flex;gap:8px;align-items:center;min-width:0}
.row-s .name span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-s .name em{font-style:normal;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;background:var(--surface2);color:var(--muted);padding:1px 8px;border-radius:99px;flex:none}
.row-s .gain{font-variant-numeric:tabular-nums;color:var(--muted)}
.row-s.ok .gain{color:var(--lime)}
.row-s .score{font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
.streak{display:inline-flex;align-items:center;gap:2px;color:var(--flame);flex:none}
.streak svg{width:20px;height:20px}

/* Podium */
.podium{align-items:center;text-align:center}
.banner{font-family:var(--font-display);font-size:clamp(1.8rem,7vw,3rem);line-height:1.1;color:var(--yellow);text-wrap:balance}
.steps{display:flex;align-items:flex-end;justify-content:center;gap:10px;width:100%;max-width:560px;padding-top:12px}
.col{flex:1;max-width:180px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.col .who{font-weight:800;line-height:1.2;max-width:100%;overflow-wrap:anywhere}
.col .who small{display:block;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.block{width:100%;height:calc(var(--h) * 1.9px);border-radius:12px 12px 0 0;display:flex;justify-content:center;padding-top:10px;transform-origin:bottom;animation:rise .7s var(--delay,0ms) cubic-bezier(.2,.9,.3,1) both;color:var(--ink);font-family:var(--font-display);font-size:2rem}
.c0 .block{background:var(--yellow)} .c1 .block{background:var(--cyan)} .c2 .block{background:var(--pink)}
.c0 .who{color:var(--yellow)}
.more{width:100%;max-width:560px}
.refresh{color:var(--muted);font-weight:600}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-12px;width:10px;height:16px;animation:fall linear forwards}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;translate:0 -.5em;scale:.6}to{opacity:1;translate:0 0;scale:1}}
@keyframes slide{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
@keyframes rise{from{transform:scaleY(.04)}to{transform:scaleY(1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}

@media (max-width:520px){
  .answers{grid-template-columns:minmax(0,1fr)}
  .ans{min-height:64px;padding:14px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .confetti{display:none}
}
</style>

var SHAPES=['▲','◆','●','■'];
var FLAME='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c1.2 4.2-3.6 6.3-3.6 11a3.6 3.6 0 0 0 7.2 0c0-1.2-.5-2.3-1.2-3.4 3.2 1.1 5.4 4.2 5.4 8A8.3 8.3 0 0 1 12 24.5 8.3 8.3 0 0 1 3.7 17.1C3.7 9.8 12 8 12 1.5z" fill="#ff7a1a"/><path d="M12 12.5c.6 1.7-1.4 2.6-1.4 4.4a1.4 1.4 0 0 0 2.8 0c0-1-.5-1.5-.9-2.2.9.4 1.6 1.2 1.6 2.4a3 3 0 0 1-6 0c0-2.5 2.6-3 3.9-4.6z" fill="#ffd23f"/></svg>';

var app=document.getElementById('app');
var S={mode:'single',screen:'menu',names:[''],locked:true};

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(n){return n.toLocaleString('en-US');}
/* Kahoot-style speed scoring: 1000 for an instant answer, falling to 500 at the buzzer. */
function points(elapsed){var f=Math.min(Math.max(elapsed/T,0),1);return Math.round(1000*(1-f/2));}
window.__mmq={points:points};

/* ---------- Screens ---------- */
var PERSON='<path d="M11 11V2l6 5 3-6 3 6 6-5v9z"/><circle cx="20" cy="25" r="9"/><path d="M2 66V54a12 12 0 0 1 12-12h12a12 12 0 0 1 12 12v12z"/>';
function people(n){
  var out='';
  for(var i=0;i<n;i++)out+='<g transform="translate('+(i*46)+' 0)">'+PERSON+'</g>';
  return '<svg viewBox="0 0 '+(n*40+(n-1)*6)+' 68" aria-hidden="true">'+out+'</svg>';
}
/* Stacked logo from the sketch: puffy MUSIC with a note, slanted MANIA with a ?, blocky QUIZ on a slab. */
var YEL='#ffd23f',YDK='#b88f00',PNK='#ff3d8b',PDK='#a3125a',INK='#1a0c2e';
function layered(id,face,deep,n){
  var o='';
  for(var i=n;i>=1;i--)o+='<g fill="'+deep+'" transform="translate('+(i*0.8)+' '+i+')"><use href="#'+id+'"/></g>';
  return o+'<g fill="'+face+'" stroke="'+INK+'" stroke-width="5" stroke-linejoin="round" paint-order="stroke fill"><use href="#'+id+'"/></g>';
}
var BOWL='font-family="\'Bowlby One\',Impact,\'Arial Black\',sans-serif"';
var BUNG='font-family="Bungee,Impact,\'Arial Black\',sans-serif"';
var LOGO='<svg class="logo-art" viewBox="0 0 640 400" role="img" aria-label="Music Mania Quiz">'+
 '<defs>'+
  '<g id="l1" '+BOWL+' font-size="112"><text x="34" y="110" textLength="452" lengthAdjust="spacingAndGlyphs">MUSIC</text></g>'+
  '<g id="l2" '+BUNG+' font-size="108" transform="translate(46 0) skewX(-12)"><text x="40" y="222" textLength="460" lengthAdjust="spacingAndGlyphs">MANIA</text></g>'+
  '<g id="qq" '+BOWL+' font-size="140"><text x="34" y="332">Q</text></g>'+
  '<g id="l3" '+BUNG+' font-size="104"><text x="190" y="332" textLength="350" lengthAdjust="spacingAndGlyphs">UIZ</text></g>'+
  '<g id="qm" '+BOWL+' font-size="120" transform="rotate(8 575 190)"><text x="548" y="236">?</text></g>'+
  '<g id="note"><ellipse cx="540" cy="92" rx="14" ry="9.5" transform="rotate(-20 540 92)"/><ellipse cx="582" cy="84" rx="14" ry="9.5" transform="rotate(-20 582 84)"/>'+
   '<rect x="550" y="40" width="6" height="52"/><rect x="592" y="32" width="6" height="52"/><polygon points="550,40 598,32 598,45 550,53"/></g>'+
  '<polygon id="slab" points="150,352 592,338 582,362 160,374"/>'+
 '</defs>'+
 '<rect x="6" y="6" width="628" height="388" rx="24" fill="#1e1340" stroke="#8a80b0" stroke-width="6"/>'+
 '<rect x="16" y="16" width="608" height="368" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="2"/>'+
 layered('l1',YEL,YDK,8)+layered('note',PNK,PDK,3)+layered('l2',PNK,PDK,8)+layered('qm',YEL,YDK,5)+layered('slab',PNK,PDK,4)+layered('qq',YEL,YDK,8)+layered('l3',YEL,YDK,8)+
'</svg>';

function menu(){
  S.screen='menu';
  app.innerHTML='<section class="screen menu">'+
    '<p class="crumb"><b>M</b>ain <b>M</b>enu</p>'+
    '<div class="menu-grid" role="radiogroup" aria-label="Game mode">'+
      '<button class="mode" role="radio" data-mode="single" aria-checked="'+(S.mode==='single')+'">'+people(1)+'<span>Single<br>Player</span><small>You vs. two bots</small></button>'+
      '<h1 class="logo-cell">'+LOGO+'</h1>'+
      '<button class="mode" role="radio" data-mode="multi" aria-checked="'+(S.mode==='multi')+'">'+people(3)+'<span>Multi<br>Player</span><small>2 to 6 players, one device</small></button>'+
    '</div>'+
    '<button class="play play-outline" data-act="play" data-primary>PLAY</button>'+
    '<button class="link" data-act="how">How to play</button>'+
  '</section>';
}

function howto(){
  S.screen='how';
  app.innerHTML='<section class="screen howto">'+
    '<h2>How to play</h2>'+
    '<ul>'+
      '<li><b>Goal</b><span>Answer '+N+' music and pop culture questions. The player with the most points wins the podium.</span></li>'+
      '<li><b>Answering</b><span>Each question gives you '+T+' seconds. Pick one of four answers. The result shows up as soon as everyone has answered or the timer runs out.</span></li>'+
      '<li><b>Points</b><span>A correct answer scores up to 1000 points. The faster you answer, the more you get. A wrong answer or a timeout scores 0, and you never lose points.</span></li>'+
      '<li><b>Streaks</b><span>Get more than 2 in a row right and a flame appears next to your name on the scoreboard.</span></li>'+
      '<li class="keys"><b>Controls</b><span>Click or tap an answer, or press <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd>. Press <kbd>Enter</kbd> to continue.</span></li>'+
      '<li><b>Multiplayer</b><span>Players share one device. Before each turn the screen names who is up, so pass the device along and keep your answer to yourself.</span></li>'+
      '<li><b>Play again</b><span>Refresh the page when the podium is done.</span></li>'+
    '</ul>'+
    '<button class="play" data-act="menu" data-primary style="align-self:center">BACK</button>'+
  '</section>';
}

function lobby(){
  S.screen='lobby';
  var multi=S.mode==='multi';
  var fields='';
  for(var i=0;i<S.names.length;i++){
    fields+='<div class="field"><label for="n'+i+'">'+(multi?'Player '+(i+1):'Your name')+'</label><div class="row">'+
      '<input type="text" id="n'+i+'" data-i="'+i+'" maxlength="14" autocomplete="off" placeholder="Player '+(i+1)+'" value="'+esc(S.names[i])+'">'+
      (multi&&i>=2?'<button class="mini" data-act="rm" data-i="'+i+'" aria-label="Remove player '+(i+1)+'">Remove</button>':'')+
    '</div></div>';
  }
  app.innerHTML='<section class="screen lobby">'+
    '<h2>'+(multi?'Who is playing?':'Ready to play?')+'</h2>'+
    '<p class="note" style="text-align:left">'+(multi?'Add 2 to 6 players. Everyone answers every question on this device.':'You will play against two bots, Auto-Tune and B-Side, so there is always a podium to fight for.')+'</p>'+
    fields+
    (multi&&S.names.length<6?'<button class="link" data-act="add" style="align-self:flex-start">+ Add a player</button>':'')+
    '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">'+
      '<button class="play" data-act="start" data-primary>START QUIZ</button>'+
      '<button class="link" data-act="menu">Back</button>'+
    '</div>'+
  '</section>';
}

/* Each game: 3 recent questions, at most 1 classic, the rest 2010s and 2020s. */
function pickQuestions(){
  var fresh=shuffle(Q.filter(function(q){return q.t==='new';}));
  var old=shuffle(Q.filter(function(q){return q.t==='old';}));
  var mod=shuffle(Q.filter(function(q){return !q.t;}));
  var pick=fresh.slice(0,3).concat(old.slice(0,1));
  pick=pick.concat(mod.slice(0,N-pick.length));
  return shuffle(pick).slice(0,N);
}

function startGame(){
  var multi=S.mode==='multi';
  var names=multi?S.names:S.names.slice(0,1);
  var humans=names.map(function(n,i){return {name:(n||'').trim().slice(0,14)||('Player '+(i+1)),bot:false};});
  var bots=multi?[]:[{name:'Auto-Tune',bot:true,p:0.7},{name:'B-Side',bot:true,p:0.5}];
  S.players=humans.concat(bots).map(function(p){p.score=0;p.streak=0;p.gain=0;p.ok=false;return p;});
  S.qs=pickQuestions().map(function(q){
    var idx=shuffle([0,1,2,3]);
    return {q:q.q,a:idx.map(function(i){return q.a[i];}),c:idx.indexOf(0),note:q.note};
  });
  S.qi=0;
  beginQuestion();
}

function beginQuestion(){
  S.humans=S.players.filter(function(p){return !p.bot;});
  S.turn=0;
  S.players.forEach(function(p){p.gain=0;p.ok=false;});
  showTurn();
}

function showTurn(){
  if(S.humans.length>1){
    S.screen='ready';
    app.innerHTML='<section class="screen ready">'+
      '<p class="small">Question '+(S.qi+1)+' of '+N+'</p>'+
      '<p class="small">Pass the device to</p>'+
      '<p class="big">'+esc(S.humans[S.turn].name)+'</p>'+
      '<button class="play" data-act="go" data-primary>I\'M READY</button>'+
    '</section>';
  } else showQuestion();
}

function showQuestion(){
  var q=S.qs[S.qi], p=S.humans[S.turn];
  S.screen='question';
  var btns='';
  q.a.forEach(function(t,i){
    btns+='<button class="ans a'+i+'" data-ans="'+i+'"><span class="shape" aria-hidden="true">'+SHAPES[i]+'</span><span>'+esc(t)+'</span></button>';
  });
  app.innerHTML='<section class="screen">'+
    '<div class="hud"><span class="pill">Question '+(S.qi+1)+' / '+N+'</span><span>'+esc(p.name)+'</span><span class="pill">'+fmt(p.score)+' pts</span></div>'+
    '<div class="timer"><div class="bar"><i id="fill"></i></div><b id="secs">'+T+'</b></div>'+
    '<h2 class="q">'+esc(q.q)+'</h2>'+
    '<div class="answers">'+btns+'</div>'+
    '<p class="hint">Press 1 to 4 to answer</p>'+
  '</section>';
  S.locked=false;
  S.t0=performance.now();
  clearInterval(S.timer);
  S.timer=setInterval(tick,100);
}

function tick(){
  var el=(performance.now()-S.t0)/1000, left=Math.max(0,T-el);
  var f=document.getElementById('fill'), s=document.getElementById('secs');
  if(f){f.style.width=(left/T*100)+'%';f.className=left<=5?'low':'';}
  if(s)s.textContent=Math.ceil(left);
  if(left<=0)answer(null);
}

function answer(i){
  if(S.locked)return;
  S.locked=true;
  clearInterval(S.timer);
  var el=Math.min(T,(performance.now()-S.t0)/1000);
  var q=S.qs[S.qi], p=S.humans[S.turn];
  p.ok=(i===q.c);
  p.gain=p.ok?points(el):0;
  var btns=app.querySelectorAll('.ans');
  btns.forEach(function(b,k){b.classList.add(k===i?'picked':'dim');});
  setTimeout(function(){
    S.turn++;
    if(S.turn<S.humans.length)showTurn(); else reveal();
  },i===null?600:450);
}

function reveal(){
  var q=S.qs[S.qi];
  S.screen='reveal';
  S.players.forEach(function(p){
    if(p.bot){p.ok=Math.random()<p.p;p.gain=p.ok?points(2+Math.random()*9):0;}
    p.score+=p.gain;
    p.streak=p.ok?p.streak+1:0;
  });
  var ranked=S.players.slice().sort(function(a,b){return b.score-a.score;});
  var rows=ranked.map(function(p,i){
    var fl=p.streak>=3?'<span class="streak" title="'+p.streak+' correct in a row">'+FLAME+'<b>'+p.streak+'</b></span>':'';
    return '<li class="row-s '+(p.ok?'ok':'miss')+'" style="--d:'+(i*60)+'ms">'+
      '<span class="rank">'+(i+1)+'</span>'+
      '<span class="name"><span class="n">'+esc(p.name)+'</span>'+(p.bot?'<em>bot</em>':'')+fl+'</span>'+
      '<span class="gain">+'+fmt(p.gain)+'</span>'+
      '<span class="score">'+fmt(p.score)+'</span></li>';
  }).join('');
  var verdict='';
  if(S.humans.length===1){
    var h=S.humans[0];
    verdict='<p class="verdict '+(h.ok?'good':'bad')+'">'+(h.ok?'Correct! +'+fmt(h.gain):'Not this time')+'</p>';
  }
  var last=S.qi===N-1;
  app.innerHTML='<section class="screen">'+
    '<div class="hud"><span class="pill">Question '+(S.qi+1)+' / '+N+'</span><span class="muted">Scoreboard</span></div>'+
    verdict+
    '<div class="correct a'+q.c+'"><span class="shape" aria-hidden="true">'+SHAPES[q.c]+'</span><div><small>Correct answer</small><strong>'+esc(q.a[q.c])+'</strong></div></div>'+
    '<p class="note">'+esc(q.note)+'</p>'+
    '<ol class="board">'+rows+'</ol>'+
    '<button class="play" data-act="next" data-primary style="align-self:center">'+(last?'SEE THE PODIUM':'NEXT QUESTION')+'</button>'+
  '</section>';
}

function podium(){
  S.screen='podium';
  var r=S.players.slice().sort(function(a,b){return b.score-a.score;});
  var top=r.slice(0,3);
  var order=[1,0,2].filter(function(i){return top[i];});
  var heights=[100,72,52], delays=[1400,700,0];
  var cols=order.map(function(i){
    return '<div class="col c'+i+'"><div class="who">'+esc(top[i].name)+(top[i].bot?' (bot)':'')+'<small>'+fmt(top[i].score)+' pts</small></div>'+
      '<div class="block" style="--h:'+heights[i]+';--delay:'+delays[i]+'ms">'+(i+1)+'</div></div>';
  }).join('');
  var banner;
  if(r[1]&&r[1].score===r[0].score)banner='It\'s a tie between '+esc(r[0].name)+' and '+esc(r[1].name)+'!';
  else if(S.mode==='single')banner=r[0].bot?esc(r[0].name)+' takes the crown this time.':'You win, '+esc(r[0].name)+'!';
  else banner=esc(r[0].name)+' wins!';
  var more=r.slice(3).map(function(p,i){
    return '<li class="row-s"><span class="rank">'+(i+4)+'</span><span class="name"><span class="n">'+esc(p.name)+'</span></span><span class="gain"></span><span class="score">'+fmt(p.score)+'</span></li>';
  }).join('');
  app.innerHTML='<section class="screen podium">'+
    '<p class="tag">Final results</p>'+
    '<p class="banner">'+banner+'</p>'+
    '<div class="steps">'+cols+'</div>'+
    (more?'<ol class="board more">'+more+'</ol>':'')+
    '<p class="refresh">Refresh the page to play again.</p>'+
  '</section>';
  confetti();
}

function confetti(){
  var fx=document.getElementById('fx'), cols=['#ff3d8b','#2fd6ff','#ffd23f','#8cf04a'], h='';
  for(var i=0;i<36;i++){
    h+='<i style="left:'+(Math.random()*100)+'%;background:'+cols[i%4]+';animation-duration:'+(2.5+Math.random()*2.5)+'s;animation-delay:'+(1.2+Math.random()*1.5)+'s"></i>';
  }
  fx.innerHTML=h;
}

/* ---------- Input ---------- */
app.addEventListener('click',function(e){
  var m=e.target.closest('[data-mode]');
  if(m){
    S.mode=m.dataset.mode;
    app.querySelectorAll('[data-mode]').forEach(function(b){b.setAttribute('aria-checked',String(b===m));});
    return;
  }
  var a=e.target.closest('[data-ans]');
  if(a){answer(+a.dataset.ans);return;}
  var b=e.target.closest('[data-act]');
  if(!b)return;
  switch(b.dataset.act){
    case 'play': S.names=S.mode==='multi'?['','']:['']; lobby(); break;
    case 'how': howto(); break;
    case 'menu': menu(); break;
    case 'add': if(S.names.length<6){S.names.push('');lobby();var el=document.getElementById('n'+(S.names.length-1));if(el)el.focus();} break;
    case 'rm': S.names.splice(+b.dataset.i,1); lobby(); break;
    case 'start': startGame(); break;
    case 'go': showQuestion(); break;
    case 'next': S.qi++; if(S.qi>=N)podium(); else beginQuestion(); break;
  }
});
app.addEventListener('input',function(e){
  var i=e.target.dataset&&e.target.dataset.i;
  if(i!==undefined&&e.target.tagName==='INPUT')S.names[+i]=e.target.value;
});
document.addEventListener('keydown',function(e){
  if(S.screen==='question'&&!S.locked&&/^[1-4]$/.test(e.key)){answer(+e.key-1);return;}
  if(e.key==='Enter'&&document.activeElement===document.body){
    var p=app.querySelector('[data-primary]');
    if(p)p.click();
  }
});

menu();
})();
</script>
